name: notify
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
    secrets:
      NOTIFY_TOKEN:
        required: true
jobs:
  notification_workflow:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: print the input
        run: echo "The input is ${{ inputs.environment }}"

